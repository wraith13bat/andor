<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Fallabda (Pong)</title>
    <style>
        body {
            background-color: #0b0f0b;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff66;
            letter-spacing: 2px;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
            border: 4px solid #00ff66;
            background-color: #000;
        }

        canvas {
            display: block;
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
            color: #88cc99;
        }
    </style>
</head>
<body>

    <h1>RETRO PONG</h1>
    
    <div id="game-container">
        <canvas id="pongCanvas" width="800" height="500"></canvas>
    </div>

    <div class="instructions">
        Irányítás: <strong>FEL / LE nyilak</strong> vagy <strong>W / S</strong> billentyűk
    </div>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        // Játékállapot objektumok
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            speed: 5,
            velocityX: 5,
            velocityY: 5
        };

        const player = {
            x: 20,
            y: canvas.height / 2 - 40,
            width: 12,
            height: 80,
            score: 0,
            speed: 8,
            yChange: 0
        };

        const ai = {
            x: canvas.width - 32,
            y: canvas.height / 2 - 40,
            width: 12,
            height: 80,
            score: 0,
            speed: 4.5 // Az AI sebessége (itt lehet nehezíteni vagy könnyíteni)
        };

        // Billentyűzet figyelése
        const keys = {};
        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
        });
        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        function handleInput() {
            if (keys["ArrowUp"] || keys["w"] || keys["W"]) {
                player.y -= player.speed;
            }
            if (keys["ArrowDown"] || keys["s"] || keys["S"]) {
                player.y += player.speed;
            }

            // Pálya határainak ellenőrzése a játékosnak
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }
        }

        // Ütközésvizsgálat (labda és ütő között)
        function collision(b, p) {
            b.top = b.y - b.radius;
            b.bottom = b.y + b.radius;
            b.left = b.x - b.radius;
            b.right = b.x + b.radius;

            p.top = p.y;
            p.bottom = p.y + p.height;
            p.left = p.x;
            p.right = p.x + p.width;

            return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
        }

        // Labda alaphelyzetbe állítása pont után
        function resetBall(winner) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 5;
            // A vesztes felé induljon a labda
            ball.velocityX = winner === 'player' ? 5 : -5;
            ball.velocityY = (Math.random() * 6) - 3;
        }

        // Játék logika frissítése
        function update() {
            handleInput();

            // Labda mozgatása
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Egyszerű AI a jobb oldali ütőhöz (követi a labdát Y tengelyen)
            let aiCenter = ai.y + ai.height / 2;
            if (aiCenter < ball.y - 10) {
                ai.y += ai.speed;
            } else if (aiCenter > ball.y + 10) {
                ai.y -= ai.speed;
            }

            // AI pályahatárok
            if (ai.y < 0) ai.y = 0;
            if (ai.y + ai.height > canvas.height) {
                ai.y = canvas.height - ai.height;
            }

            // Felső és alsó fal ütközés
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.velocityY = -ball.velocityY;
            }

            // Melyik ütővel ütközhet?
            let activePaddle = (ball.x < canvas.width / 2) ? player : ai;

            if (collision(ball, activePaddle)) {
                // Számoljuk ki, hol találta el az ütőt (hogy változzon a visszaverődés szöge)
                let collidePoint = ball.y - (activePaddle.y + activePaddle.height / 2);
                collidePoint = collidePoint / (activePaddle.height / 2);

                // Szög kiszámítása
                let angleRad = (Math.PI / 4) * collidePoint;

                // Irány váltás
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;

                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);

                // Sebesség növelése ahogy telik az idő
                ball.speed += 0.3;
            }

            // Pontozás (Gólok)
            if (ball.x - ball.radius < 0) {
                ai.score++;
                resetBall('ai');
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                resetBall('player');
            }
        }

        // Kirajzolás a vászonra
        function draw() {
            // Háttér törlése
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Középső szaggatott vonal
            ctx.strokeStyle = "#00ff6655";
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Visszaállítás

            // Pontszámok kirajzolása
            ctx.fillStyle = "#00ff66";
            ctx.font = "50px 'Courier New'";
            ctx.textAlign = "center";
            ctx.fillText(player.score, canvas.width / 4, 70);
            ctx.fillText(ai.score, (canvas.width / 4) * 3, 70);

            // Játékos ütő
            ctx.fillStyle = "#00ff66";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // AI ütő
            ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

            // Labda
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2, false);
            ctx.fillStyle = "#00ff66";
            ctx.fill();
            ctx.closePath();
        }

        // Fő játékciklus
        function gameLoop() {
            update();
            draw();
        }

        // Képfrissítéshez igazított ütemezés (FPS)
        const fps = 60;
        setInterval(gameLoop, 1000 / fps);
    </script>

</body>
</html>
