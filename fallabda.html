
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fallabda játék</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-bottom: 10px;
      color: #67f5b5;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 30px;
      width: min(800px, 95vw);
      padding: 12px 4px;
      font-size: 18px;
    }

    canvas {
      width: min(800px, 95vw);
      height: auto;
      border: 3px solid #67f5b5;
      border-radius: 8px;
      background: #17283a;
      cursor: none;
      touch-action: none;
    }

    button {
      margin-top: 16px;
      padding: 12px 28px;
      border: 0;
      border-radius: 8px;
      background: #67f5b5;
      color: #102018;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    p {
      color: #cbd5e1;
      text-align: center;
      padding: 0 12px;
    }
  </style>
</head>
<body>

  <h1>🎾 Fallabda</h1>

  <div class="hud">
    <span>Visszaütések: <b id="score">0</b></span>
    <span>Rekord: <b id="best">0</b></span>
  </div>

  <canvas id="game" width="800" height="500"></canvas>

  <button id="restart">Új játék</button>
  <p>Mozgasd az egeret az ütő irányításához!</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");

    const W = canvas.width;
    const H = canvas.height;

    const paddle = {
      x: W / 2 - 55,
      y: H - 35,
      w: 110,
      h: 13
    };

    const ball = {
      x: W / 2,
      y: H / 2,
      r: 10,
      vx: 4,
      vy: 4
    };

    let score = 0;
    let best = 0;
    let gameOver = false;
    let running = true;

    bestEl.textContent = best;

    function resetGame() {
      score = 0;
      scoreEl.textContent = score;
      gameOver = false;
      running = true;

      paddle.x = W / 2 - paddle.w / 2;

      ball.x = W / 2;
      ball.y = H / 2;
      ball.vx = Math.random() < 0.5 ? -4 : 4;
      ball.vy = 4;

      draw();
    }

    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      paddle.x = (e.clientX - rect.left) * scaleX
                 - paddle.w / 2;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      paddle.x = (e.touches[0].clientX - rect.left) * scaleX
                 - paddle.w / 2;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    }, { passive: false });

    document.getElementById("restart")
      .addEventListener("click", resetGame);

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Háttér és fal
      ctx.fillStyle = "#17283a";
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = "#456078";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 70);
      ctx.lineTo(W, 70);
      ctx.stroke();

      // Labda
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = "#d8ff54";
      ctx.shadowColor = "#d8ff54";
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Ütő
      ctx.fillStyle = "#67f5b5";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

      if (gameOver) {
        ctx.fillStyle = "rgba(5, 10, 20, 0.82)";
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ff7373";
        ctx.font = "bold 44px Arial";
        ctx.fillText("JÁTÉK VÉGE!", W / 2, H / 2 - 35);

        ctx.fillStyle = "white";
        ctx.font = "24px Arial";
        ctx.fillText(
          "Sikeres visszaütések: " + score,
          W / 2, H / 2 + 10
        );

        ctx.font = "18px Arial";
        ctx.fillText(
          "Kattints az Új játék gombra!",
          W / 2, H / 2 + 50
        );
      }
    }

    function update() {
      if (gameOver || !running) return;

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Oldalfalak
      if (ball.x - ball.r <= 0) {
        ball.x = ball.r;
        ball.vx = Math.abs(ball.vx);
      }

      if (ball.x + ball.r >= W) {
        ball.x = W - ball.r;
        ball.vx = -Math.abs(ball.vx);
      }

      // Felső fal
      if (ball.y - ball.r <= 0) {
        ball.y = ball.r;
        ball.vy = Math.abs(ball.vy);
      }

      // Ütővel való ütközés
      if (
        ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x &&
        ball.x - ball.r <= paddle.x + paddle.w
      ) {
        ball.y = paddle.y - ball.r;

        // Az ütő közepétől való távolság
        const hit = (ball.x - (paddle.x + paddle.w / 2))
                    / (paddle.w / 2);

        // A találat helye meghatározza a visszaütés irányát
        ball.vx = hit * 6;
        ball.vy = -Math.max(4, Math.abs(ball.vy));

        // Fokozatosan gyorsul a labda
        const speed = Math.min(
          1.08,
          1 + score * 0.008
        );
        ball.vx *= speed;
        ball.vy *= speed;

        score++;
        scoreEl.textContent = score;

        if (score > best) {
          best = score;
          bestEl.textContent = best;
        }
      }

      // Ha a labda leesik
      if (ball.y - ball.r > H) {
        gameOver = true;
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    resetGame();
    loop();
  </script>

</body>
</html>
