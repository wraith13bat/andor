<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pong Játék</title>
    <style>
        body {
            background-color: #111;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ff00;
        }

        canvas {
            border: 4px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            background-color: #000;
        }

        .instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #00aa00;
        }
    </style>
</head>
<body>

    <h1>RETRO PONG</h1>
    <canvas id="pongCanvas" width="800" height="400"></canvas>
    <div class="instructions">Irányítás: Mozgasd az egeret fel-le a bal oldali ütőhöz.</div>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        // Labda objektum
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 10,
            speed: 5,
            velocityX: 5,
            velocityY: 5,
            color: "#00ff00"
        };

        // Játékos ütő (bal oldal)
        const player = {
            x: 10,
            y: canvas.height / 2 - 40,
            width: 12,
            height: 80,
            score: 0,
            color: "#00ff00"
        };

        // AI ütő (jobb oldal)
        const ai = {
            x: canvas.width - 22,
            y: canvas.height / 2 - 40,
            width: 12,
            height: 80,
            score: 0,
            color: "#00ff00"
        };

        // Egér mozgásának figyelése a játékos irányításához
        canvas.addEventListener("mousemove", (evt) => {
            let rect = canvas.getBoundingClientRect();
            let root = document.documentElement;
            let mouseY = evt.clientY - rect.top - root.scrollTop;
            player.y = mouseY - player.height / 2;

            // Ne menjen ki a képernyőről
            if (player.y < 0) player.y = 0;
            if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;
        });

        // Ütközésvizsgálat
        function collision(b, p) {
            b.top = b.y - b.radius;
            b.bottom = b.y + b.radius;
            b.left = b.x - b.radius;
            b.right = b.x + b.radius;

            p.top = p.y;
            p.bottom = p.y + p.height;
            p.left = p.x;
            p.right = p.x + p.width;

            return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
        }

        // Labda alaphelyzetbe állítása pont után
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.velocityX = -ball.velocityX;
            ball.speed = 5;
        }

        // Játékállapot frissítése
        function update() {
            // Labda mozggatása
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // AI egyszerű intelligenciája (követi a labdát)
            let aiSpeed = 0.08; // Minél nagyobb, annál nehezebb legyőzni
            ai.y += (ball.y - (ai.y + ai.height / 2)) * aiSpeed;

            // AI határok ellenőrzése
            if (ai.y < 0) ai.y = 0;
            if (ai.y > canvas.height - ai.height) ai.y = canvas.height - ai.height;

            // Felső és alsó falak elérése
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.velocityY = -ball.velocityY;
            }

            // Kijelöljük, hogy épp melyik ütővel ütközhet
            let activePaddle = (ball.x < canvas.width / 2) ? player : ai;

            if (collision(ball, activePaddle)) {
                // Hol találta el az ütőt? (forgásszög módosításához)
                let collidePoint = ball.y - (activePaddle.y + activePaddle.height / 2);
                collidePoint = collidePoint / (activePaddle.height / 2);

                // Szög kiszámítása radiánban (max 45 fok)
                let angleRad = (Math.PI / 4) * collidePoint;

                // Irány váltása
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;

                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);

                // Sebesség növelése minden ütésnél
                ball.speed += 0.3;
            }

            // Pontszámok frissítése
            if (ball.x - ball.radius < 0) {
                ai.score++;
                resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                resetBall();
            }
        }

        // Grafika kirajzolása
        function render() {
            // Háttér törlése
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Középvonal (retro szaggatott vonal)
            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Visszaállítjuk az alapvonalra

            // Pontszámok kirajzolása
            ctx.font = "40px 'Courier New'";
            ctx.fillStyle = "#00ff00";
            ctx.textAlign = "center";
            ctx.fillText(player.score, canvas.width / 4, 50);
            ctx.fillText(ai.score, canvas.width * 3 / 4, 50);

            // Játékos ütő
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // AI ütő
            ctx.fillStyle = ai.color;
            ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

            // Labda (retro nézetben lehet négyzet vagy kör, itt kör)
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2, false);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
        }

        // Játék futtató hurok (Game Loop)
        function gameLoop() {
            update();
            render();
        }

        // Képkockák indítása (60 FPS)
        const fps = 60;
        setInterval(gameLoop, 1000 / fps);
    </script>

</body>
</html>
