
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Szorzótábla gyakorló</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 25px 0;
      color: #234;
    }

    .container {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0002;
      text-align: center;
      width: 480px;
      max-width: calc(100% - 24px);
    }

    h1 { font-size: 27px; }
    h2 { font-size: 23px; }
    #progress { color: #555; }

    #question {
      font-size: 42px;
      font-weight: bold;
      margin: 25px 0;
    }

    #timer {
      font-size: 22px;
      color: #d97706;
      margin-bottom: 15px;
    }

    input {
      font-size: 22px;
      width: 220px;
      max-width: 100%;
      padding: 10px;
      text-align: center;
      border: 2px solid #aaa;
      border-radius: 8px;
    }

    button {
      font-size: 17px;
      padding: 11px 20px;
      margin: 8px 3px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
    button:disabled { background: #999; cursor: default; }

    #feedback {
      min-height: 28px;
      font-size: 17px;
      margin-top: 15px;
    }

    .hidden { display: none !important; }
    .success { color: #15803d; }
    .error { color: #b91c1c; }
    .timeout { color: #b45309; }

    #grade {
      font-size: 30px;
      font-weight: bold;
      margin: 15px 0;
    }

    .grade-5 { color: #15803d; }
    .grade-3 { color: #b45309; }
    .grade-1 { color: #b91c1c; }

    #wrongList {
      text-align: left;
      padding-left: 25px;
    }

    #wrongList li { margin: 8px 0; }

    .table-wrap {
      overflow-x: auto;
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    th, td {
      padding: 10px 6px;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }

    th {
      background: #eff6ff;
      color: #1e3a8a;
    }

    .my-result {
      background: #eff6ff;
      font-weight: bold;
    }

    .status {
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .muted { color: #64748b; }
  </style>
</head>

<body>
<div class="container">
  <h1>Szorzótábla gyakorló</h1>


<section id="nameScreen">
  <p>Üdvözöl a szorzótábla gyakorló!</p>
  <p>Add meg a neved, és próbálj felkerülni a toplistára.</p>

  <form id="nameForm">
    <input
      id="username"
      type="text"
      minlength="1"
      maxlength="20"
      placeholder="Játékos neve"
      autocomplete="nickname"
      required
    >
    <br>
    <button type="submit">Játék indítása</button>
  </form>

  <h2>🏆 Toplista</h2>
  <p class="muted">A legjobb eredmények sorrendjében.</p>

  <div id="startLeaderboard" class="table-wrap">
    Toplista betöltése...
  </div>
</section>


  <section id="gameScreen" class="hidden">
    <p id="playerLabel"></p>
    <p id="progress">1 / 30. kérdés</p>
    <div id="question"></div>
    <div id="timer"></div>

    <form id="answerForm">
      <input
        id="answer"
        type="number"
        step="1"
        placeholder="Válasz"
        autocomplete="off"
        required
      >
      <br>
      <button id="submitButton" type="submit">Válasz</button>
    </form>
  </section>

  <div id="feedback" aria-live="polite"></div>

  <section id="resultScreen" class="hidden">
    <div id="result"></div>
    <p id="saveStatus" class="status" aria-live="polite"></p>

    <h2>🏆 Toplista</h2>
    <p class="muted">A legjobb eredmények sorrendjében.</p>

    <div id="leaderboard" class="table-wrap">
      Toplista betöltése...
    </div>

    <button id="retryButton" type="button">Új játék</button>
  </section>
</div>

<script>
  // 1. Supabase-beállítások
  const SUPABASE_URL = "https://fgujexuxurwcifnhqgrw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_a5y93z8MGceUKv7K8LGVdQ_P8G29G7n";

  const supabaseConfigured =
    SUPABASE_URL.startsWith("https://") &&
    !SUPABASE_URL.includes("IDE-IRD") &&
    SUPABASE_ANON_KEY.length > 20 &&
    !SUPABASE_ANON_KEY.includes("IDE-IRD");

  const db = supabaseConfigured
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // 2. Játékbeállítások
  const MIN = 0;
  const MAX = 10;
  const TIME_LIMIT = 5;
  const TOTAL_QUESTIONS = 30;
  const LEADERBOARD_LIMIT = 10;

  const $ = id => document.getElementById(id);

  let username = "";
  let questions = [];
  let questionNumber = 0;
  let correctAnswers = 0;
  let wrongAnswers = [];
  let currentQuestion = null;
  let expectedAnswer = 0;
  let questionActive = false;
  let questionStartedAt = 0;
  let timer = null;
  let nextQuestionTimeout = null;
  let gameId = 0;

  // Fisher–Yates keverés
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function clearGameTimers() {
    clearInterval(timer);
    clearTimeout(nextQuestionTimeout);
    timer = null;
    nextQuestionTimeout = null;
  }

  function setFeedback(message, className = "") {
    $("feedback").textContent = message;
    $("feedback").className = className;
  }

  function showScreen(screenId) {
    ["nameScreen", "gameScreen", "resultScreen"].forEach(id => {
      $(id).classList.toggle("hidden", id !== screenId);
    });
  }

  function startGame() {
    clearGameTimers();
    gameId++;

    const allQuestions = [];

    for (let a = MIN; a <= MAX; a++) {
      for (let b = MIN; b <= MAX; b++) {
        allQuestions.push({ a, b });
      }
    }

    questions = shuffle(allQuestions).slice(0, TOTAL_QUESTIONS);
    questionNumber = 0;
    correctAnswers = 0;
    wrongAnswers = [];
    questionActive = false;

    $("playerLabel").textContent = "Játékos: " + username;
    $("result").replaceChildren();
    $("leaderboard").textContent = "";
    $("saveStatus").textContent = "";

    showScreen("gameScreen");
    setFeedback("");
    nextQuestion();
  }

  function nextQuestion() {
    clearGameTimers();

    if (questionNumber >= TOTAL_QUESTIONS) {
      finishGame();
      return;
    }

    currentQuestion = questions[questionNumber];
    questionNumber++;
    expectedAnswer = currentQuestion.a * currentQuestion.b;

    $("question").textContent =
      `${currentQuestion.a} × ${currentQuestion.b} = ?`;

    $("progress").textContent =
      `${questionNumber} / ${TOTAL_QUESTIONS}. kérdés`;

    $("answer").value = "";
    $("answer").disabled = false;
    $("submitButton").disabled = false;

    setFeedback("");

    let timeLeft = TIME_LIMIT;
    $("timer").textContent = `${timeLeft} másodperc`;

    questionActive = true;
    questionStartedAt = Date.now();
    $("answer").focus();

    timer = setInterval(() => {
      const elapsed = (Date.now() - questionStartedAt) / 1000;
      timeLeft = Math.max(0, Math.ceil(TIME_LIMIT - elapsed));

      $("timer").textContent = `${timeLeft} másodperc`;

      if (elapsed >= TIME_LIMIT) {
        handleTimeout();
      }
    }, 50);
  }

  function recordWrongAnswer(given, reason) {
    wrongAnswers.push({
      a: currentQuestion.a,
      b: currentQuestion.b,
      expected: expectedAnswer,
      given,
      reason
    });
  }

  function lockAnswer() {
    questionActive = false;
    clearInterval(timer);
    timer = null;
    $("answer").disabled = true;
    $("submitButton").disabled = true;
  }

  function submitAnswer(event) {
    event.preventDefault();

    if (!questionActive) return;

    if ((Date.now() - questionStartedAt) / 1000 >= TIME_LIMIT) {
      handleTimeout();
      return;
    }

    const raw = $("answer").value.trim();
    if (raw === "") return;

    const given = Number(raw);
    if (!Number.isSafeInteger(given)) return;

    lockAnswer();

    if (given === expectedAnswer) {
      correctAnswers++;
      setFeedback("Helyes válasz!", "success");
    } else {
      recordWrongAnswer(given, "Hibás válasz");
      setFeedback(
        `Hibás! A helyes válasz: ${expectedAnswer}`,
        "error"
      );
    }

    nextQuestionTimeout = setTimeout(nextQuestion, 500);
  }

  function handleTimeout() {
    if (!questionActive) return;

    lockAnswer();
    recordWrongAnswer(null, "Időtúllépés");

    setFeedback(
      `Lejárt az idő! Helyes válasz: ${expectedAnswer}`,
      "timeout"
    );

    nextQuestionTimeout = setTimeout(nextQuestion, 800);
  }

  function getGrade(errors) {
    if (errors === 0) {
      return {
        grade: 5,
        message: "Hibátlan munka! Gratulálok!",
        className: "grade-5"
      };
    }

    if (errors === 1) {
      return {
        grade: 3,
        message: "Egy hibád volt. Gyakorolj még!",
        className: "grade-3"
      };
    }

    return {
      grade: 1,
      message: "Most több hiba is becsúszott. Ne add fel!",
      className: "grade-1"
    };
  }

  function addText(parent, tag, text, className = "") {
    const element = document.createElement(tag);
    element.textContent = text;
    if (className) element.className = className;
    parent.appendChild(element);
    return element;
  }

  function renderResult(correct, errors, gradeInfo) {
    const result = $("result");
    result.replaceChildren();

    addText(
      result,
      "h2",
      `${username} eredménye: ${correct} / ${TOTAL_QUESTIONS}`
    );

    addText(
      result,
      "p",
      `Helyes válaszok: ${Math.round(correct / TOTAL_QUESTIONS * 100)}%`
    );

    addText(
      result,
      "p",
      `Hibás válaszok és időtúllépések: ${errors}`
    );

    addText(
      result,
      "div",
      `Érdemjegy: ${gradeInfo.grade}`,
      gradeInfo.className
    ).id = "grade";

    addText(result, "p", gradeInfo.message);

    if (wrongAnswers.length > 0) {
      addText(result, "h3", "Hibás válaszok részletesen");
      const list = document.createElement("ol");
      list.id = "wrongList";

      wrongAnswers.forEach(item => {
        const li = document.createElement("li");

        li.className =
          item.reason === "Időtúllépés" ? "timeout" : "error";

        li.textContent = item.reason === "Időtúllépés"
          ? `${item.a} × ${item.b}: időtúllépés. Helyes válasz: ${item.expected}`
          : `${item.a} × ${item.b}: megadott válasz: ${item.given}. Helyes válasz: ${item.expected}`;

        list.appendChild(li);
      });

      result.appendChild(list);
    } else {
      addText(result, "p", "Nem volt hibás válasz!", "success");
    }
  }

  async function finishGame() {
    clearGameTimers();
    questionActive = false;

    $("question").textContent = "Vége a játéknak!";
    $("timer").textContent = "";
    $("progress").textContent = "Végeredmény";
    showScreen("resultScreen");

    const errors = wrongAnswers.length;
    const gradeInfo = getGrade(errors);
    const finishedGameId = gameId;

    renderResult(correctAnswers, errors, gradeInfo);

    $("saveStatus").textContent = "Eredmény mentése...";
    $("leaderboard").textContent = "";

    if (!db) {
      $("saveStatus").textContent =
        "Nincs beállítva a Supabase-kapcsolat. Az eredmény nem lett elmentve.";
      $("leaderboard").textContent =
        "A toplista megjelenítéséhez állítsd be a Supabase URL-t és kulcsot.";
      return;
    }

    const resultToSave = {
      username,
      correct: correctAnswers,
      errors,
      grade: gradeInfo.grade
    };

    try {
      const { error } = await db
        .from("leaderboard")
        .insert(resultToSave);

      if (error) throw error;

      if (finishedGameId !== gameId) return;

      $("saveStatus").textContent = "✓ Az eredmény sikeresen elmentve.";
      await loadLeaderboard(finishedGameId);
    } catch (error) {
      if (finishedGameId !== gameId) return;

      console.error("Supabase mentési hiba:", error);
      $("saveStatus").textContent =
        "Az eredmény mentése nem sikerült. Ellenőrizd a kapcsolatot és az adatbázis-jogosultságokat.";

      await loadLeaderboard(finishedGameId);
    }
  }


async function loadStartLeaderboard() {
  const container = $("startLeaderboard");
  container.textContent = "Toplista betöltése...";

  if (!db) {
    container.textContent =
      "A toplista megjelenítéséhez állítsd be a Supabase-kapcsolatot.";
    return;
  }

  try {
    const { data, error } = await db
      .from("leaderboard")
      .select("id, username, correct, errors, grade, created_at")
      .order("correct", { ascending: false })
      .order("errors", { ascending: true })
      .order("created_at", { ascending: false })
      .limit(LEADERBOARD_LIMIT);

    if (error) throw error;

    renderLeaderboard(data || [], container);
  } catch (error) {
    console.error("Toplista betöltési hiba:", error);
    container.textContent =
      "A toplista jelenleg nem tölthető be. Próbáld meg később.";
  }
}

  
  async function loadLeaderboard(expectedGameId = gameId) {
    $("leaderboard").textContent = "Toplista betöltése...";

    try {
      const { data, error } = await db
        .from("leaderboard")
        .select("id, username, correct, errors, grade, created_at")
        .order("correct", { ascending: false })
        .order("errors", { ascending: true })
        .order("created_at", { ascending: false })
        .limit(LEADERBOARD_LIMIT);

      if (error) throw error;
      if (expectedGameId !== gameId) return;

      renderLeaderboard(data || []);
    } catch (error) {
      if (expectedGameId !== gameId) return;

      console.error("Toplista betöltési hiba:", error);
      $("leaderboard").textContent =
        "A toplista jelenleg nem tölthető be. Próbáld meg később.";
    }
  }


function renderLeaderboard(entries, target = $("leaderboard")) {
  const container = target;
  container.replaceChildren();

  if (entries.length === 0) {
    addText(container, "p", "Még nincs mentett eredmény.");
    return;
  }

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");

  ["#", "Játékos", "Helyes", "Hibák", "Jegy", "Időpont"]
    .forEach(label => addText(headerRow, "th", label));

  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  entries.forEach((entry, index) => {
    const tr = document.createElement("tr");

    if (
      entry.username === username &&
      entry.correct >= 0 &&
      entry.correct === Number(entry.correct)
    ) {
      tr.className = "my-result";
    }

    [
      String(index + 1),
      entry.username,
      String(entry.correct),
      String(entry.errors),
      String(entry.grade)
    ].forEach(value => addText(tr, "td", value));

    const dateCell = document.createElement("td");
    const date = new Date(entry.created_at);

    dateCell.textContent = Number.isNaN(date.getTime())
      ? "—"
      : new Intl.DateTimeFormat("hu-HU", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }).format(date);

    tr.appendChild(dateCell);
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  container.appendChild(table);
}


  $("nameForm").addEventListener("submit", event => {
    event.preventDefault();

    const name = $("username").value.trim();

    if (name.length < 1 || name.length > 20) {
      alert("A név 1 és 20 karakter közötti legyen!");
      return;
    }

    username = name;
    startGame();
  });

  $("answerForm").addEventListener("submit", submitAnswer);

  $("retryButton").addEventListener("click", () => {
    clearGameTimers();
    questionActive = false;
    $("username").value = username;
    setFeedback("");
    showScreen("nameScreen");
    $("username").focus();
  });
  
loadStartLeaderboard();

</script>
</body>
</html>
